---
- name: "Restarting all services on target hosts"
  ansible.builtin.systemd:
    name: "{{ item }}"
    state: restarted
  loop:
    - etcd.service
    - patroni.service
    - haproxy.service
    - keepalived.service
  ignore_errors: true


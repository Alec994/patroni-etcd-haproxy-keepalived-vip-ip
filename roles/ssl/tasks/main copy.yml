- name: "Creating directories on localhost"
  ansible.builtin.file:
    state: directory
    path: "{{ ssl_root_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - etcd
    - patroni
    - haproxy
  delegate_to: localhost

- name: "Creating directories on target hosts"
  ansible.builtin.file:
    state: directory
    path: "{{ ssl_root_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - etcd
    - patroni
    - haproxy

- name: "Generate ETCD Private Key"
  community.crypto.openssl_privatekey:
    path: "{{ ssl_etcd_dir }}/etcd.pem"
  delegate_to: localhost

- name: "Generate ETCD CSR"
  community.crypto.openssl_csr:
    path: "{{ ssl_etcd_dir }}/etcd.csr"
    privatekey_path: "{{ ssl_etcd_dir }}/etcd.pem"
    country_name: "{{ ssl_subject_country_name }}"
    state_or_province_name: "{{ ssl_subject_state_or_province_name }}"
    locality_name: "{{ ssl_subject_locality_name }}"
    organization_name: "{{ ssl_subject_organization_name }}"
    organizational_unit_name: "{{ ssl_subject_organizational_unit_name }}"
    common_name: "etcd"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name:
      - DNS:etcd
      - DNS:localhost
      - IP:127.0.0.1
  delegate_to: localhost


- name: "Generate Patroni Private Key"
  community.crypto.openssl_privatekey:
    path: "{{ ssl_patroni_dir }}/patroni.pem"
  delegate_to: localhost

- name: "Generate Patorni Certificate"
  community.crypto.x509_certificate:
    path: "{{ ssl_etcd_dir }}/etcd.crt"
    privatekey_path: "{{ ssl_etcd_dir }}/etcd.pem"
    csr_path: "{{ ssl_etcd_dir }}/etcd.csr"
    ownca_path: "{{ ssl_ca_cert_path }}"
    ownca_privatekey_path: "{{ ssl_ca_privatekey_path }}"
    provider: ownca
    ownca_not_after: "+3650d"
  delegate_to: localhost


# --- HAProxy ---

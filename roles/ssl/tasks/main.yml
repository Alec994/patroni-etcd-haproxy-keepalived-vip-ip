---
# --- Директории ---
- name: "Creating directories on localhost"
  ansible.builtin.file:
    state: directory
    path: "{{ ssl_root_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - etcd
    - patroni
    - haproxy
  delegate_to: localhost

- name: "Creating directories on target hosts"
  ansible.builtin.file:
    state: directory
    path: "{{ ssl_root_dir }}/{{ item }}"
    mode: '0755'
  loop:
    - etcd
    - patroni
    - haproxy

- name: "Generate CA private key"
  ansible.builtin.command:
    cmd: "openssl genpkey -algorithm RSA -out /tmp/ca-key.pem -pkeyopt rsa_keygen_bits:4096"
  delegate_to: localhost
  run_once: true

- name: "Generate self-signed CA certificate"
  ansible.builtin.command:
    cmd: >
      openssl req -x509 -new -nodes
      -key /tmp/ca-key.pem
      -sha256
      -days 3650
      -subj "/C={{ ssl_subject_country_name }}/ST={{ ssl_subject_state_or_province_name }}/L={{ ssl_subject_locality_name }}/O={{ ssl_subject_organization_name }}/OU={{ ssl_subject_organizational_unit_name }}/CN={{ ssl_ca_common_name }}"
      -out /tmp/ca-cert.pem
  delegate_to: localhost
  run_once: true

- name: "Copy CA private key"
  ansible.builtin.copy:
    src: "/tmp/ca-key.pem"
    dest: "{{ ssl_ca_privatekey_path }}"
    owner: root
    group: root
    mode: '0600'
  delegate_to: localhost
  run_once: true

- name: "Copy CA certificate"
  ansible.builtin.copy:
    src: "/tmp/ca-cert.pem"
    dest: "{{ ssl_ca_cert_path }}"
    owner: root
    group: root
    mode: '0644'
  delegate_to: localhost
  run_once: true

# --- ETCD ---
- name: "Generate ETCD Private Key"
  community.crypto.openssl_privatekey:
    path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.pem"
  delegate_to: localhost

- name: "Generate ETCD CSR"
  community.crypto.openssl_csr:
    path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.csr"
    privatekey_path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.pem"
    common_name: "{{ inventory_hostname }}"
    country_name: "{{ ssl_subject_country_name }}"
    state_or_province_name: "{{ ssl_subject_state_or_province_name }}"
    locality_name: "{{ ssl_subject_locality_name }}"
    organization_name: "{{ ssl_subject_organization_name }}"
    organizational_unit_name: "{{ ssl_subject_organizational_unit_name }}"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name:
      - DNS:{{ inventory_hostname }}
      - DNS:localhost
      - IP:127.0.0.1
      - IP:{{ ansible_facts['default_ipv4']['address'] }}
  delegate_to: localhost

- name: "Generate ETCD Certificate"
  community.crypto.x509_certificate:
    path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.crt"
    privatekey_path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.pem"
    csr_path: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.csr"
    ownca_path: "{{ ssl_ca_cert_path }}"
    ownca_privatekey_path: "{{ ssl_ca_privatekey_path }}"
    provider: ownca
    ownca_not_after: "+3650d"
  delegate_to: localhost

# --- Patroni ---
- name: "Generate Patroni Private Key"
  community.crypto.openssl_privatekey:
    path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.pem"
  delegate_to: localhost

- name: "Generate Patroni CSR"
  community.crypto.openssl_csr:
    path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.csr"
    privatekey_path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.pem"
    common_name: "{{ inventory_hostname }}"
    country_name: "{{ ssl_subject_country_name }}"
    state_or_province_name: "{{ ssl_subject_state_or_province_name }}"
    locality_name: "{{ ssl_subject_locality_name }}"
    organization_name: "{{ ssl_subject_organization_name }}"
    organizational_unit_name: "{{ ssl_subject_organizational_unit_name }}"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name:
      - DNS:{{ inventory_hostname }}
      - DNS:localhost
      - IP:127.0.0.1
      - IP:{{ ansible_facts['default_ipv4']['address'] }}
  delegate_to: localhost

- name: "Generate Patroni Certificate"
  community.crypto.x509_certificate:
    path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.crt"
    privatekey_path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.pem"
    csr_path: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.csr"
    ownca_path: "{{ ssl_ca_cert_path }}"
    ownca_privatekey_path: "{{ ssl_ca_privatekey_path }}"
    provider: ownca
    ownca_not_after: "+3650d"
  delegate_to: localhost

# --- HAProxy ---
- name: "Generate HAProxy Private Key"
  community.crypto.openssl_privatekey:
    path: "{{ ssl_haproxy_dir }}/haproxy.pem"
  delegate_to: localhost
  run_once: true

- name: "Generate HAProxy CSR"
  community.crypto.openssl_csr:
    path: "{{ ssl_haproxy_dir }}/haproxy.csr"
    privatekey_path: "{{ ssl_haproxy_dir }}/haproxy.pem"
    common_name: "haproxy"
    country_name: "{{ ssl_subject_country_name }}"
    state_or_province_name: "{{ ssl_subject_state_or_province_name }}"
    locality_name: "{{ ssl_subject_locality_name }}"
    organization_name: "{{ ssl_subject_organization_name }}"
    organizational_unit_name: "{{ ssl_subject_organizational_unit_name }}"
    key_usage:
      - digitalSignature
    extended_key_usage:
      - serverAuth
      - clientAuth
    subject_alt_name:
      - DNS:haproxy
      - DNS:localhost
      - IP:127.0.0.1
      - IP:{{ ansible_facts['default_ipv4']['address'] }}
  delegate_to: localhost
  run_once: true

- name: "Generate HAProxy Certificate"
  community.crypto.x509_certificate:
    path: "{{ ssl_haproxy_dir }}/haproxy.crt"
    privatekey_path: "{{ ssl_haproxy_dir }}/haproxy.pem"
    csr_path: "{{ ssl_haproxy_dir }}/haproxy.csr"
    ownca_path: "{{ ssl_ca_cert_path }}"
    ownca_privatekey_path: "{{ ssl_ca_privatekey_path }}"
    provider: ownca
    ownca_not_after: "+3650d"
  delegate_to: localhost
  run_once: true

- name: "Create combined PEM file for HAProxy on localhost"
  ansible.builtin.shell:
    cmd: "cat {{ ssl_haproxy_dir }}/haproxy.crt {{ ssl_haproxy_dir }}/haproxy.pem > {{ ssl_haproxy_dir }}/haproxy-full.pem"
  delegate_to: localhost
  run_once: true

# --- Копирование сертификатов ---
- name: "Copy CA certificate to all hosts"
  ansible.builtin.copy:
    src: "{{ ssl_ca_cert_path }}"
    dest: "{{ ssl_root_dir }}/ca.crt"
    mode: '0644'
    owner: root
    group: root

- name: "Copy etcd certs"
  ansible.builtin.copy:
    src: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.crt"
    dest: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.crt"
    owner: etcd
    group: etcd
    mode: '0644'
  when: inventory_hostname in groups['etcd']

- name: "Copy etcd private keys"
  ansible.builtin.copy:
    src: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.pem"
    dest: "{{ ssl_etcd_dir }}/{{ inventory_hostname }}.pem"
    owner: etcd
    group: etcd
    mode: '0600'
  when: inventory_hostname in groups['etcd']

- name: "Copy patroni certs"
  ansible.builtin.copy:
    src: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.crt"
    dest: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.crt"
    owner: postgres
    group: postgres
    mode: '0644'
  when: inventory_hostname in groups['patroni_hosts']

- name: "Copy patroni private keys"
  ansible.builtin.copy:
    src: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.pem"
    dest: "{{ ssl_patroni_dir }}/{{ inventory_hostname }}.pem"
    owner: postgres
    group: postgres
    mode: '0600'
  when: inventory_hostname in groups['patroni_hosts']

- name: "Copy haproxy full PEM"
  ansible.builtin.copy:
    src: "{{ ssl_haproxy_dir }}/haproxy-full.pem"
    dest: "{{ ssl_haproxy_dir }}/haproxy-full.pem"
    owner: root
    group: root
    mode: '0600'
  when: inventory_hostname in groups['patroni_hosts']
